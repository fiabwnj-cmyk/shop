<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>핏마켓</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  핏마켓 🔥 오늘의 의류 특가
</header>

<div class="products">

  <div class="product">
    <img src="https://images.unsplash.com/photo-1769107418962-ec5ecd084014?q=80&w=765&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="후드">
    <h2>오프화이트 후드</h2>
    <p class="price">₩39,000</p>
    <button onclick="buy()">구매하기</button>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1523381294911-8d3cead13475?w=600" alt="티셔츠">
    <h2>오프화이트 반팔</h2>
    <p class="price">₩29,000</p>
    <button onclick="buy()">구매하기</button>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=600" alt="바지">
    <h2>오프화이트 팬츠</h2>
    <p class="price">₩49,000</p>
    <button onclick="buy()">구매하기</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
